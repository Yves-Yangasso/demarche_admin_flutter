name: sunudekk_mobile
description: SunuDekk Mobile Application for Citizens.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  provider: ^6.1.5
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  sqflite: ^2.4.2
  path: ^1.8.3
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  validate_phone_number: ^1.1.1
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  generate: true